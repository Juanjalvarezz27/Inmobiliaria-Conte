name: Limpieza Automática de Almacenamiento

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 07:00 UTC (03:00 AM hora de Venezuela / UTC-4)
    - cron: '0 7 1 * *'
  workflow_dispatch: # Permite disparar la acción manualmente desde GitHub cuando desees probar

jobs:
  purgar-almacenamiento:
    name: Depuración mensual de evidencias y recibos transitorios
    runs-on: ubuntu-latest
    steps:
      - name: Invocar endpoint seguro de limpieza
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "Aviso: La variable secreta APP_URL aún no está configurada (sistema en fase de desarrollo / pre-despliegue)."
            echo "Omitiendo ejecución sin fallar. Se activará automáticamente cuando agregues APP_URL tras el despliegue."
            exit 0
          fi

          echo "Iniciando solicitud de depuración de almacenamiento..."
          HTTP_STATUS=$(curl -s -o respuesta.json -w "%{http_code}" -X POST "${{ secrets.APP_URL }}/api/cron/limpieza-almacenamiento" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"dias": 90, "dryRun": false}')

          echo "Código HTTP recibido: $HTTP_STATUS"
          echo "Respuesta del servidor:"
          cat respuesta.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: La depuración de almacenamiento no completó con éxito (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Depuración ejecutada con éxito."
